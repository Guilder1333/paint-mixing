# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin
kotlin.code.style=official

# AndroidX
android.useAndroidx=true
android.nonTransitiveRClass=true

# AGP 9 introduced a new build DSL and built-in Kotlin compilation as the new
# defaults. Both are still young (this project started Sept 2026) and change
# how third-party Gradle plugins (KSP, Room, Navigation) need to be wired, in
# ways not yet consistently documented. Opt back into the AGP 8-style DSL and
# an explicit org.jetbrains.kotlin.android plugin, which is the well-proven
# path. This opt-out is supported through AGP 9.x and removed in AGP 10 --
# revisit then.
android.newDsl=false
android.builtInKotlin=false
